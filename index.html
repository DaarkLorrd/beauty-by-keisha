<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>For Chikoso ❤️</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
    background:linear-gradient(135deg,#ff4b91,#ff758c,#ff9a9e,#fad0c4);
    background-size:400% 400%;
    animation:bgMove 12s ease infinite;
}

@keyframes bgMove{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
}

.container{
    text-align:center;
    padding:40px;
    z-index:2;
}

.heart{
    font-size:90px;
    animation:beat .9s infinite;
    margin-bottom:20px;
}

h1{
    color:#fff;
    font-size:4rem;
    text-shadow:0 0 15px rgba(255,255,255,.9);
    animation:glow 2s infinite alternate;
}

p{
    color:#fff;
    font-size:1.6rem;
    margin-top:20px;
    line-height:1.6;
    max-width:700px;
}

@keyframes beat{
    0%,100%{transform:scale(1);}
    50%{transform:scale(1.25);}
}

@keyframes glow{
    from{
        text-shadow:0 0 10px #fff,
                    0 0 20px #ff69b4,
                    0 0 35px #ff1493;
    }
    to{
        text-shadow:0 0 20px #fff,
                    0 0 40px #ff69b4,
                    0 0 60px #ff1493;
    }
}

.floating-heart{
    position:absolute;
    color:#fff;
    animation:float linear forwards;
    opacity:0.9;
}

@keyframes float{
    from{
        transform:translateY(100vh) scale(.5);
        opacity:0;
    }
    20%{opacity:1;}
    to{
        transform:translateY(-120vh) scale(1.5);
        opacity:0;
    }
}
</style>
</head>

<body>

<div class="container">
    <div class="heart">❤️</div>
    <h1>I Love You, Chikoso ❤️</h1>
    <p>
        You are the most beautiful part of my life.<br>
        Every heartbeat reminds me how lucky I am to have you.<br>
        No matter where life takes us, my heart will always choose you.
        💖 Forever and Always. 💖
    </p>
</div>

<script>
function createHeart(){
    const heart = document.createElement("div");
    heart.className = "floating-heart";
    heart.innerHTML = ["❤️","💕","💖","💘","💝","💗"][Math.floor(Math.random()*6)];
    heart.style.left = Math.random()*100 + "vw";
    heart.style.fontSize = (20 + Math.random()*40) + "px";
    heart.style.animationDuration = (5 + Math.random()*5) + "s";

    document.body.appendChild(heart);

    setTimeout(() => heart.remove(), 10000);
}

setInterval(createHeart, 180);
</script>

</body>
</html>
