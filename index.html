<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>For Treasure ❤️</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
    background:linear-gradient(135deg,#ff4b91,#ff758c,#ff9a9e,#fad0c4);
    background-size:400% 400%;
    animation:bgMove 12s ease infinite;
}

@keyframes bgMove{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
}

.container{
    text-align:center;
    z-index:2;
    padding:40px;
}

h1{
    font-size:4rem;
    color:white;
    text-shadow:0 0 15px rgba(255,255,255,.8);
    animation:glow 2s infinite alternate;
}

h2{
    margin-top:20px;
    color:white;
    font-size:2rem;
    font-weight:300;
    opacity:.95;
}

.heart{
    font-size:90px;
    animation:beat .9s infinite;
    margin:20px 0;
}

@keyframes beat{
    0%,100%{transform:scale(1);}
    50%{transform:scale(1.25);}
}

@keyframes glow{
    from{
        text-shadow:0 0 10px white,
                    0 0 20px #ff66b2,
                    0 0 30px #ff1493;
    }
    to{
        text-shadow:0 0 20px white,
                    0 0 40px #ff66b2,
                    0 0 60px #ff1493;
    }
}

.floating-heart{
    position:absolute;
    color:#fff;
    font-size:25px;
    animation:float linear infinite;
    opacity:.8;
}

@keyframes float{
    from{
        transform:translateY(100vh) scale(.5);
        opacity:0;
    }
    20%{opacity:1;}
    to{
        transform:translateY(-120vh) scale(1.5);
        opacity:0;
    }
}
</style>
</head>

<body>

<div class="container">
    <div class="heart">❤️</div>
    <h1>I Love You, Treasure ❤️</h1>
    <h2>
        Every heartbeat whispers your name.<br>
        You are my favorite person, my peace,<br>
        my happiness, and my forever. 💖
    </h2>
</div>

<script>
function createHeart(){
    const heart=document.createElement("div");
    heart.className="floating-heart";
    heart.innerHTML=["❤️","💖","💕","💘","💗","💞"][Math.floor(Math.random()*6)];

    heart.style.left=Math.random()*100+"vw";
    heart.style.fontSize=(20+Math.random()*35)+"px";
    heart.style.animationDuration=(5+Math.random()*6)+"s";

    document.body.appendChild(heart);

    setTimeout(()=>{
        heart.remove();
    },11000);
}

setInterval(createHeart,180);
</script>

</body>
</html>
